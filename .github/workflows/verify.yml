name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: go mod tidy (must be clean)
        run: |
          go mod tidy -go=1.24.0
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are dirty after 'go mod tidy'"
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod || true
            if [ -f go.sum ]; then
              git diff -- go.sum || true
            fi
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
