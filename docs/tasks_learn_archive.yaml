         - /buildinfo が 200 を返すこと
         - content-type が application/json であること
      4) 仕上げ: go test ./... を通す。
      5) 反映: feature/enhance-007-buildinfo を切ってコミット→push→mainへ取り込み。
    acceptance_criteria:
      - "GET /buildinfo が200を返す"
      - "JSONで goVersion 等の情報が返る（unknownでも可）"
      - "go test ./... が通る"


