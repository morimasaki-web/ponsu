  - id: LEARN-011
    title: "小改善: Request ID ミドルウェア追加（X-Request-ID）"
    status: done
    priority: low
    branch: "enhance/011-request-id"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
      目的: ミドルウェアで「横断的な処理」を付与する練習（トレーシングの第一歩）。

      手順:
      1) 実装: internal/interface/http/request_id_middleware.go を追加する。
         - 受信ヘッダに X-Request-ID があればそれを採用
         - 無ければ新規に生成（短いランダム文字列でOK。crypto/rand を推奨）
         - レスポンスヘッダに X-Request-ID を必ず付与
      2) 配線: internal/interface/http/mux.go で全体をラップ（Recover と順序を考える）。
         - 例: Recover(RequestID(mux)) など
      3) テスト: internal/interface/http/request_id_middleware_test.go
         - リクエストにX-Request-IDを付けたらレスポンスにも同じ値が入る
         - 無い場合でもレスポンスに値が入る（空でない）
      4) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "すべてのレスポンスに X-Request-ID が付く"
      - "go test ./... が通る"

