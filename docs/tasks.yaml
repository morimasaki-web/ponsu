# Ponsu Development Tasks (YAML)
#
# 方針（MVP確定）
# - DB: PostgreSQL
# - DBアクセス: sqlc
# - API: GraphQL (gqlgen)
# - 監査/状態管理: Event Sourcing（event_store + 同期プロジェクション）
# - UI: SPA化を見据えたSSR
# - 認可: RBAC
# - 通知: Slack（Incoming Webhook）
# - 添付: MinIO（S3互換）を推奨（実装はStorage抽象で差し替え可能に）
# - マイグレーション: golang-migrate/migrate を推奨

project: Ponsu
version: 1.0.0-mvp
created_at: 2026-01-12

external_review:
  enabled: false
  note: "外部LLM（Claude Code等）レビューは一旦運用しない。needs_claude_review は将来再開用の目印として残す。"

status_values: [todo, in_progress, done, blocked]
priority_values: [low, medium, high]

tasks:
  # -------------------------
  # 0. 基盤・開発環境
  # -------------------------
  - id: MVP-000
    title: "開発環境前提の整備（Go/Docker/実行ポリシー手順）"
    status: done
    priority: high
    branch: "feature/mvp-000-dev-prereqs"
    depends_on: []
    needs_claude_review: false
    description: "Windows環境で `go` が使えること、Dockerが使えること、verifyスクリプトが実行できることの手順をドキュメント化する。"
    start_date: 2026-01-12
    end_date: 2026-01-12
    deliverables:
      - "docs/instruction.md（Go/Docker導入、PATH確認、verify.cmdの使い方）"
    acceptance_criteria:
      - "新規環境で `go version` が確認できる手順が書かれている"
      - "`ponsu\\scripts\\verify.cmd` が実行できる手順が書かれている"

  - id: MVP-001
    title: "Goプロジェクト初期化（Clean Architecture雛形）"
    status: done
    priority: high
    branch: "feature/mvp-001-bootstrap"
    depends_on: [MVP-000]
    needs_claude_review: true
    description: "Go module初期化、基本ディレクトリ、最小のmain起動、設定読み込みの足場を作る。"
    start_date: 2026-01-12
    end_date: 2026-01-12
    deliverables:
      - "go.mod / go.sum"
      - "cmd/ponsu/（エントリポイント）"
      - "internal/{domain,usecase,interface,infrastructure}/（雛形）"
      - "Makefile または Taskfile（任意）"
    acceptance_criteria:
      - "`go test ./...` が通る"
      - "`go run ./cmd/ponsu` が起動してログを出す"

  - id: MVP-002
    title: "ローカル開発環境（Postgres/MinIO）をdocker-composeで用意"
    status: done
    priority: high
    branch: "feature/mvp-002-dev-env"
    depends_on: [MVP-001]
    needs_claude_review: false
    description: "イベントストア/Read Modelを動かすための依存サービスをローカルで立ち上げられるようにする。"
    start_date: 2026-01-12
    end_date: 2026-01-12
    deliverables:
      - "compose.yaml（Postgres, MinIO, 必要ならAdminer等）"
      - "環境変数例（.env.example）"
    acceptance_criteria:
      - "`docker compose up -d` で Postgres と MinIO が起動する"
      - "アプリから接続できる（疎通確認コード or ヘルスチェック）"

  - id: MVP-003
    title: "DBマイグレーション導入（golang-migrate/migrate）"
    status: done
    priority: high
    branch: "feature/mvp-003-migrations"
    depends_on: [MVP-002]
    needs_claude_review: true
    description: "SQLマイグレーションの運用を確立し、CI/開発で確実に同じ状態を作れるようにする。"
    start_date: 2026-01-12
    end_date: 2026-01-12
    deliverables:
      - "migrations/（up/down SQL）"
      - "migrate実行手段（Makefile/Taskfile/README）"
    acceptance_criteria:
      - "ローカルで up/down が実行できる"
      - "新規DBから最新スキーマを再現できる"

  - id: MVP-004
    title: "sqlc 導入（クエリ・生成・レイヤ境界の定義）"
    status: done
    priority: high
    branch: "feature/mvp-004-sqlc"
    depends_on: [MVP-003]
    needs_claude_review: true
    description: "sqlc設定、クエリ配置、生成コードの置き場所、Repository境界を確定する。"
    deliverables:
      - "sqlc.yaml（または sqlc.json）"
      - "db/query/*.sql"
      - "生成コード配置（例: internal/infrastructure/dbgen）"
    acceptance_criteria:
      - "`sqlc generate` が成功する"
      - "最小クエリでDB疎通ができる"

  - id: MVP-005
    title: "検証スクリプトをCIで実行（GitHub Actions）"
    status: done
    priority: medium
    branch: "feature/mvp-005-ci-verify"
    depends_on: [MVP-000]
    needs_claude_review: false
    description: "無料検証（go test/vet/golangci-lint/govulncheck）をPR/Pushで自動実行し、漏れを防ぐ。"
    start_date: 2026-01-12
    end_date: 2026-01-12
    deliverables:
      - ".github/workflows/verify.yml（新規）"
    acceptance_criteria:
      - "PRで `go test ./...` が必ず走る"
      - "golangci-lint と govulncheck も実行される（失敗で落ちる）"

