  - id: LEARN-001
    title: "診断: ヘルスチェックエンドポイント実装"
    status: todo
    priority: medium
    branch: "enhance/001-healthz"
    depends_on: []
    needs_claude_review: false
    description: |
      目的: コンテナオーケストレーション環境でのヘルスチェックに対応し、Kubernetes等でのサービス可用性監視を可能にする。

      学習ポイント:
      - net/http の基本（ServeMux, Handler, HandlerFunc）
      - httptest によるHTTPハンドラのテスト
      - JSONレスポンスの返し方

      手順:
      1) internal/interface/http/mux.go を読み、ルーティングの仕組みを理解する
      2) GET /healthz を追加（認証不要、常に200とJSONを返す）
      3) httptest を使ってテストを書く（status, content-type, body）
      4) go test ./internal/interface/http/... を通す
    acceptance_criteria:
      - "GET /healthz が 200 を返す"
      - "レスポンスが JSON で {\"status\":\"ok\"} を含む"
      - "テストが追加され、go test が通る"

  - id: LEARN-018
    title: "監査: 集約単位のイベント履歴取得API実装"
    status: done
    priority: high
    branch: "enhance/018-event-store-query"
    depends_on: [LEARN-001]
    needs_claude_review: false
    description: |
      目的: 特定の申請に対する全変更履歴を時系列で取得可能にし、監査証跡の追跡性を強化する。

      学習ポイント:
      - event_store テーブルの構造と役割
      - aggregate_id によるイベント取得
      - sqlc によるクエリ実装
      - トランザクション境界の考え方

      手順:
      1) db/query/event_store.sql を読み、既存クエリを理解する
      2) GetEventsByAggregateID クエリを追加（aggregate_id でフィルタ、sequence_number 昇順）
      3) sqlc で生成し、internal/infrastructure/postgres/event_store.go に実装を追加
      4) テストを書く（testdata でイベントを挿入して取得できることを確認）
    acceptance_criteria:
      - "指定した aggregate_id のイベントを時系列で取得できる"
      - "空の場合も正常に動作する"
      - "go test ./internal/infrastructure/postgres/... が通る"

