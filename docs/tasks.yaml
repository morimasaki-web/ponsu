    description: "イベントソーシングの要所（replay/楽観ロック/投影）と主要フローの自動テストを追加する。"
    acceptance_criteria:
      - "主要フローのテストが通る"
      - "version競合時の挙動がテストで保証される"

  - id: MVP-101
    title: "MVP受け入れチェック（E2E手順/デモ手順のドキュメント化）"
    status: todo
    priority: medium
    branch: "feature/mvp-101-mvp-check"
    depends_on: [MVP-060, MVP-071, MVP-080, MVP-091]
    needs_claude_review: false
    description: "手動検証の手順とデモシナリオをドキュメント化し、MVP完了条件を満たすか確認できる状態にする。"
    deliverables:
      - "docs/mvp-checklist.md（新規）または同等の文書"
    acceptance_criteria:
      - "作成→提出→承認/却下→監査参照が手順通りに再現できる"
      - "差し戻し→再提出が再現できる"