    description: "MinIOに保存できるようにし、デモ運用の“それっぽさ”を担保する。"
    acceptance_criteria:
      - "MinIOへ保存される"
      - "署名URL or プロキシ配信のどちらかで閲覧できる"

  # -------------------------
  # 8. 通知（Slack）
  # -------------------------
  - id: MVP-080
    title: "Slack通知（Incoming Webhook）"
    status: todo
    priority: medium
    branch: "feature/mvp-080-slack"
    depends_on: [MVP-032]
    needs_claude_review: false
    description: "提出/承認/却下/差し戻し（後半）などのイベントに応じてSlackへ通知する。"
    acceptance_criteria:
      - "提出時にSlackへ通知が飛ぶ"
      - "通知内容に申請タイトル/URL/実行者が含まれる"

  # -------------------------
  # 9. MVP後半: 差し戻し/再提出
  # -------------------------
  - id: MVP-090
    title: "差し戻し（returned）/再提出（resubmitted）イベントと状態遷移"
    status: todo
    priority: high
    branch: "feature/mvp-090-return-resubmit"
    depends_on: [MVP-031, MVP-022, MVP-030]
    needs_claude_review: true
    description: "return/resubmitのイベント追加、Read Model投影、監査表示を整合させる。"
    acceptance_criteria:
      - "差し戻し→修正→再提出が可能"
      - "監査（イベント）が正しく残る"

  - id: MVP-091
    title: "SSR/GraphQL: 差し戻し・再提出UIとMutation追加"
    status: todo
    priority: high
    branch: "feature/mvp-091-return-resubmit-ui"
    depends_on: [MVP-090, MVP-060, MVP-051]
    needs_claude_review: false
    description: "差し戻し理由の入力、再提出の導線、GraphQL mutation を追加する。"
    acceptance_criteria:
      - "画面から差し戻し・再提出ができる"
      - "RBAC/担当者以外が操作できない"

  # -------------------------
  # 10. 品質: テスト/リント/最終受け入れ
  # -------------------------
  - id: MVP-100
    title: "テスト整備（Aggregate replay / 競合 / 主要ユースケース）"
    status: todo
    priority: high
    branch: "feature/mvp-100-tests"
    depends_on: [MVP-032, MVP-090]
