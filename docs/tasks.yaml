  - id: LEARN-037
    title: "Frontend: テスト環境セットアップ（Vitest + Testing Library）"
    status: todo
    priority: medium
    branch: "enhance/037-frontend-testing"
    depends_on: []
    needs_claude_review: false
    description: |
      目的: フロントエンドのテスト環境を構築し、コンポーネント・フック・統合テストを実行可能にする。

      学習ポイント:
      - Vitestの設定とViteとの統合
      - React Testing Libraryの使い方
      - urqlのモッキング
      - React Router のテスト

      手順:
      1) 必要なパッケージをインストール
         ```bash
         cd frontend
         npm install -D vitest @vitest/ui jsdom
         npm install -D @testing-library/react @testing-library/jest-dom
         npm install -D @testing-library/user-event
         ```
      2) vitest.config.ts を作成
         ```ts
         import { defineConfig } from 'vitest/config'
         import react from '@vitejs/plugin-react'

         export default defineConfig({
           plugins: [react()],
           test: {
             globals: true,
             environment: 'jsdom',
             setupFiles: './src/test/setup.ts',
           },
         })
         ```
      3) src/test/setup.ts を作成（Testing Library設定）
      4) package.json にテストスクリプトを追加
         - "test": "vitest"
         - "test:ui": "vitest --ui"
         - "test:coverage": "vitest --coverage"
      5) サンプルテストを作成（useDebounce.test.ts等）
      6) 既存コンポーネントのテストを追加
         - RequestSearchBar.test.tsx
         - CommentForm.test.tsx
    acceptance_criteria:
      - "npm test でテストが実行できる"
      - "@testing-library/react でコンポーネントをテストできる"
      - "urqlのクエリ/ミューテーションをモックできる"
      - "サンプルテストが通る"
