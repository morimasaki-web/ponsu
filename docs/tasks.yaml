      手順:
      1) 実装: internal/interface/http/mux.go に GET /readyz を追加（認証不要）。
         - レスポンス: status=200, body={"ok":true}
         - content-type は application/json を付ける
      2) テスト: internal/interface/http/readyz_test.go を追加する。
         - /readyz が 200 を返す
         - content-type が application/json を含む
         - JSONがデコード可能（{"ok":true}）
      3) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "GET /readyz が200とJSONを返す"
      - "テストが追加されている"
      - "go test ./... が通る"


  - id: LEARN-010
    title: "小改善: JSONレスポンスヘルパー writeJSON を追加（Go/http）"
    status: todo
    priority: low
    branch: "enhance/010-writejson-helper"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
      目的: ルール（Content-Type/ステータス/エンコード）を1箇所に集約し、実装を簡潔にする練習。

      手順:
      1) 実装: internal/interface/http/json.go を新規作成し、writeJSON(w, status, v) を用意する。
         - content-type: application/json; charset=utf-8
         - status を設定してから json.NewEncoder(w).Encode(v)
      2) 置換: /buildinfo や /readyz があれば、それらで writeJSON を使う。
      3) テスト: internal/interface/http/json_test.go を追加し、
         - writeJSON が content-type をセットする
         - status が反映される
         - JSONとしてデコード可能
      4) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "writeJSON が追加され、複数箇所で利用されている（最低1箇所でOK）"
      - "go test ./... が通る"


  - id: LEARN-011
    title: "小改善: Request ID ミドルウェア追加（X-Request-ID）"
    status: done
    priority: low
    branch: "enhance/011-request-id"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
      目的: ミドルウェアで「横断的な処理」を付与する練習（トレーシングの第一歩）。

      手順:
      1) 実装: internal/interface/http/request_id_middleware.go を追加する。
         - 受信ヘッダに X-Request-ID があればそれを採用
         - 無ければ新規に生成（短いランダム文字列でOK。crypto/rand を推奨）
         - レスポンスヘッダに X-Request-ID を必ず付与
      2) 配線: internal/interface/http/mux.go で全体をラップ（Recover と順序を考える）。
         - 例: Recover(RequestID(mux)) など
      3) テスト: internal/interface/http/request_id_middleware_test.go
         - リクエストにX-Request-IDを付けたらレスポンスにも同じ値が入る
         - 無い場合でもレスポンスに値が入る（空でない）
      4) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "すべてのレスポンスに X-Request-ID が付く"
      - "go test ./... が通る"


  - id: LEARN-012
    title: "小改善: アクセスログミドルウェア追加（status/durationを出す）"
    status: todo
    priority: low
    branch: "enhance/012-access-log"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
      目的: ResponseWriter をラップして status を観測する練習（実務で頻出）。

      手順:
      1) 実装: internal/interface/http/access_log_middleware.go を追加。
         - 開始時刻を取る
         - next を呼ぶ
         - method/path/status/duration を logger.Info で出す
         - status は ResponseWriter をラップして取得する（WriteHeaderの記録）
      2) 配線: internal/interface/http/mux.go で全体をラップ。
      3) テスト: internal/interface/http/access_log_middleware_test.go
         - ステータス200/500などのケースで、レスポンスのstatusが壊れていないこと
         - （ログ内容まで厳密に見る必要はなく、panicしない/レスポンスが正常でOK）
      4) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "リクエストごとに status と duration をログに出す"
      - "go test ./... が通る"


