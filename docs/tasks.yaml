  # -------------------------
  # 13. 学習用エンハンス（自分で実装）
  # -------------------------

  - id: LEARN-001
    title: "小改善: /healthz ヘルスチェックエンドポイント追加（Go/http）"
    status: todo
    priority: low
    branch: "feature/enhance-001-healthz"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
      目的: PonSu のHTTP配線（mux/handler）とテスト（httptest）に慣れる。

      手順:
      1) 探索: internal/interface/http/mux.go を開き、ルーティング（ServeMux等）の作り方を確認する。
      2) 実装: GET /healthz を追加する（認証不要）。レスポンスはJSONでOK。
         - 例: status=200, body={"ok":true}
         - content-type は application/json を付ける
      3) テスト: httptest を使って /healthz が 200 を返すことをテストする。
         - テスト対象は「mux生成関数」または handler を直接呼ぶ形がよい
      4) 仕上げ: go test ./... を通す。
      5) 反映: feature/enhance-001-healthz を切ってコミット→push→mainへ取り込み。
    acceptance_criteria:
      - "GET /healthz が常に200を返す（未ログインでもOK）"
      - "レスポンスがJSONである（Content-Type含む）"
      - "テストが1本以上追加され、go test ./... が通る"


  - id: LEARN-004
    title: "小改善: demoモードの説明文を集約（文言の一貫性）"
    status: todo
    priority: low
    branch: "feature/enhance-004-demo-copy"
    depends_on: [MVP-122]
    needs_claude_review: false
    description: |
      目的: アプリ全体の“文章（コピー）”を揃えて、読み手に優しいデモにする。

      手順:
      1) 探索: frontend/src で「静的デモ」「認証/DBなし」などの文言がどこに出ているか探す。
      2) 実装: frontend/src/copy.ts のようなファイルを作り、デモ説明の文言を定数としてまとめる。
      3) 置換: App.tsx / RequestsList.tsx / RequestDetail.tsx のデモ説明を定数参照に置き換える。
      4) 確認: npm run build を通す。
      5) 反映: feature/enhance-004-demo-copy を切ってコミット→push→mainへ取り込み。
    acceptance_criteria:
      - "デモ説明の文言が1箇所に集約されている"
      - "npm run build が成功する"


  - id: LEARN-008
    title: "小改善: /buildinfo のレスポンス形式を固定（JSONスキーマ安定化）"
    status: done
    priority: low
    branch: "enhance/008-buildinfo-schema"
    depends_on: [LEARN-007]
    needs_claude_review: false
    description: |
      目的: 仕様のブレ（string or object）を無くし、クライアントから扱いやすいAPIにする練習。

      手順:
      1) 探索: internal/interface/http/mux.go の /buildinfo 実装を確認する。
      2) 仕様決定: 常に object を返す形式にする。
         - 例: {"goVersion":"1.22.x","mainModule":"github.com/..."}
         - 取得できない場合も {"goVersion":"unknown","mainModule":"unknown"} のように固定する。
      3) 実装: /buildinfo の実装を更新する（JSONキー名は lowerCamelCase を推奨）。
      4) テスト: internal/interface/http/buildinfo_test.go を更新し、json.Decoder でデコードしてキーが存在することを確認する。
      5) 仕上げ: go test ./... を通す。
    acceptance_criteria:
      - "/buildinfo は常にJSON objectを返す（型が揺れない）"
      - "unknown時も同じスキーマで返る"
      - "go test ./... が通る"


  - id: LEARN-009
    title: "小改善: /readyz エンドポイント追加（JSONでOKを返す）"
    status: done
    priority: low
    branch: "enhance/009-readyz"
    depends_on: [MVP-116]
    needs_claude_review: false
    description: |
