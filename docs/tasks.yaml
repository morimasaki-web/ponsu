  - id: LEARN-018
    title: "監査: 集約単位のイベント履歴取得API実装"
    status: done
    priority: high
    branch: "enhance/018-event-store-query"
    depends_on: [LEARN-001]
    needs_claude_review: false
    description: |
      目的: 特定の申請に対する全変更履歴を時系列で取得可能にし、監査証跡の追跡性を強化する。

      学習ポイント:
      - event_store テーブルの構造と役割
      - aggregate_id によるイベント取得
      - sqlc によるクエリ実装
      - トランザクション境界の考え方

      手順:
      1) db/query/event_store.sql を読み、既存クエリを理解する
      2) GetEventsByAggregateID クエリを追加（aggregate_id でフィルタ、sequence_number 昇順）
      3) sqlc で生成し、internal/infrastructure/postgres/event_store.go に実装を追加
      4) テストを書く（testdata でイベントを挿入して取得できることを確認）
    acceptance_criteria:
      - "指定した aggregate_id のイベントを時系列で取得できる"
      - "空の場合も正常に動作する"
      - "go test ./internal/infrastructure/postgres/... が通る"

  - id: LEARN-019
    title: "分析: ユーザー別申請統計の自動集計機能追加"
    status: done
    priority: high
    branch: "enhance/019-user-stats-projector"
    depends_on: [LEARN-018]
    needs_claude_review: false
    description: |
      目的: ユーザーごとの申請数・最終申請日を自動集計し、ダッシュボードでの利用状況分析を可能にする。

      学習ポイント:
      - イベントから読み取りモデルを構築する仕組み
      - プロジェクタの実装パターン
      - 冪等性の確保（同じイベントを複数回処理しても問題ない）

      手順:
      1) cmd/projector/main.go と既存プロジェクタを読む
      2) マイグレーションで user_stats テーブルを追加（user_id, request_count, last_request_at）
      3) UserStatsProjector を実装（RequestCreated イベントで統計を更新）
      4) projector に組み込んで動作確認
    acceptance_criteria:
      - "RequestCreated イベント発生時に user_stats が更新される"
      - "冪等性が保たれる（同じイベントを再処理しても壊れない）"
      - "マイグレーション up/down が動作する"

