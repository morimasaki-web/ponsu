version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/*.up.sql"
    queries:
      - "db/query/*.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/infrastructure/dbgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_empty_slices: true
